; Settings for BWDecomp.dll. Copy next to BWDecomp.dll in the Black & White folder. Every fix is described in
; docs/FIXES.md; set a value to 0 to restore the original behaviour.

[Fixes]
; Report DirectX 9.0c to the start-up check: the disc's 1999 DSETUP.dll cannot identify current DirectX, so
; the game quits with "You need DirectX 7 or greater".
DirectXVersionReport=1
; Play without the disc: when no disc (or mounted image) labelled BNW is found, use the install folder, which
; tools/install/install_game.py fills with everything the disc provides. 0 = original disc check (drives D-Y,
; quits after 30 seconds).
DiscFromInstallFolder=1
; Run 16-bit colour modes at 32 bits: current drivers cannot create a Direct3D 7 hardware device on a 16-bit
; display mode, and the game then crashes at start-up.
ColorDepth32=1
; Opt out of Windows DPI scaling so full-screen and windowed modes use real pixels.
DpiAware=1
; Make the SELFMOD section (self-modifying rasteriser code) executable so the game survives DEP.
ExecutableSelfModifyingCode=1
; Largest physical memory reported to the game (it sizes the audio cache as RAM / 8). 0 = report the real value.
MaxReportedPhysicalMemoryMB=512
; Largest free video memory reported to the game. 0 = only prevent the signed 32-bit overflow.
MaxReportedVideoMemoryMB=1024

[Hooks]
; Original addresses (hex) whose decompiled replacement is switched off, e.g. to bisect a regression:
; Disabled=0x0045c610 0x00749a70
Disabled=

[Diagnostics]
; Log who ends the process or shows a message box (with return addresses into the original code).
TraceExit=1
; Log exceptions with registers and a scan of return addresses on the stack.
TraceExceptions=1
; Copy the game's own debug output (OutputDebugString) into BWDecomp.log.
ForwardDebugOutput=0

[Log]
; 1 = also log every installed hook in BWDecomp.log.
Debug=0
