; Settings for BWDecomp.dll. Copy next to BWDecomp.dll in the Black & White folder. Every fix is described in
; docs/FIXES.md; set a value to 0 to restore the original behaviour.

[Fixes]
; Opt out of Windows DPI scaling so full-screen and windowed modes use real pixels.
DpiAware=1
; Make the SELFMOD section (self-modifying rasteriser code) executable so the game survives DEP.
ExecutableSelfModifyingCode=1
; Largest physical memory reported to the game (it sizes the audio cache as RAM / 8). 0 = report the real value.
MaxReportedPhysicalMemoryMB=512
; Largest free video memory reported to the game. 0 = only prevent the signed 32-bit overflow.
MaxReportedVideoMemoryMB=1024

[Hooks]
; Original addresses (hex) whose decompiled replacement is switched off, e.g. to bisect a regression:
; Disabled=0x0045c610 0x00749a70
Disabled=

[Log]
; 1 = also log every installed hook in BWDecomp.log.
Debug=0
