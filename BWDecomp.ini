; Settings for BWDecomp.dll. Copy next to BWDecomp.dll in the Black & White folder. Every fix is described in
; docs/FIXES.md; set a value to 0 to restore the original behaviour.

[Fixes]
; Report DirectX 9.0c to the start-up check: the disc's 1999 DSETUP.dll cannot identify current DirectX, so
; the game quits with "You need DirectX 7 or greater".
DirectXVersionReport=1
; Play without the disc: when no disc (or mounted image) labelled BNW is found, use the install folder, which
; tools/install/install_game.py fills with everything the disc provides. 0 = original disc check (drives D-Y,
; quits after 30 seconds).
DiscFromInstallFolder=1
; Run 16-bit colour modes at 32 bits: current drivers cannot create a Direct3D 7 hardware device on a 16-bit
; display mode, and the game then crashes at start-up.
ColorDepth32=1
; When Direct3D cannot render at the chosen resolution (current drivers refuse widths above 2048), use the
; largest smaller display mode with the same aspect ratio instead of crashing.
DisplayModeFallback=1
; A request to close the game window (WM_CLOSE, e.g. from taskkill) quits the game like Alt+F4 instead of
; destroying the window and leaving the game running without one.
CloseRequestsQuit=1
; While the game is minimised, wait for messages instead of keeping a CPU core busy, and let it quit (taskbar
; Close, Alt+F4) instead of hanging until it is restored.
MinimisedWait=1
; If the game is still running this many seconds after it was asked to quit, log where it is stuck
; (BWDecomp.log) and end the process. 0 = wait forever.
ShutdownTimeoutSeconds=60
; Opt out of Windows DPI scaling so full-screen and windowed modes use real pixels.
DpiAware=1
; Make the SELFMOD section (self-modifying rasteriser code) executable so the game survives DEP.
ExecutableSelfModifyingCode=1
; Largest physical memory reported to the game (it sizes the audio cache as RAM / 8). 0 = report the real value.
MaxReportedPhysicalMemoryMB=512
; Largest free video memory reported to the game. 0 = only prevent the signed 32-bit overflow.
MaxReportedVideoMemoryMB=1024

[Display]
; 0 = exclusive full screen (as the original). 1 = in a window. 2 = borderless window covering the screen.
; In modes 1 and 2 the picture is scaled to the window, so a screen wider than 2048 pixels (the most Direct3D 7
; renders) is filled from a smaller resolution. The debug menu bar is hidden; its shortcuts still work.
WindowMode=0
; When scaling, keep the game's aspect ratio (black bars) instead of stretching the picture.
KeepAspectRatio=1
; 1 = Direct3D 9 (see docs/RENDERER.md): any resolution, e.g. 2560x1440; no display-mode changes (WindowMode 0
; becomes 2). 0 = the original DirectDraw/Direct3D 7 renderer (at most 2048 pixels wide). Without Direct3D 9Ex the
; original renderer runs.
Renderer=1
; Direct3D 9 renderer: wait for the display's refresh (no tearing).
VSync=1
; Direct3D 9 renderer: anisotropic texture filtering, 2-16 (sharper ground at a distance). 0 = off.
Anisotropy=0
; Direct3D 9 renderer: anti-aliasing (multisampling), samples per pixel 2-16 (e.g. 4 or 8; smoother edges). 0 = off.
AntiAliasing=0
; Direct3D 9 renderer: compressed textures the game unpacks into 16-bit textures (4 bits per colour) keep their full
; colours. 0 = as the original.
FullPrecisionTextures=1

[Textures]
; Texture packs for the Direct3D 9 renderer (see docs/TEXTURES.md). Textures are named by a hash of their contents:
; bw_<16 hex digits>.
; 1 = save every texture the game draws, once, to Textures\Dump\ in the game folder (for making replacements).
Dump=0
; 1 = draw images from Textures\Replace\ (and folders below it) instead of the textures with the same hash: any
; size, 32-bit with alpha, as PNG, DDS, BMP, JPEG or TIFF.
Replace=1

[Hooks]
; Original addresses (hex) whose decompiled replacement is switched off, e.g. to bisect a regression:
; Disabled=0x0045c610 0x00749a70
Disabled=

[Diagnostics]
; Log who ends the process or shows a message box (with return addresses into the original code).
TraceExit=1
; Log exceptions with registers and a scan of return addresses on the stack.
TraceExceptions=1
; Copy the game's own debug output (OutputDebugString) into BWDecomp.log.
ForwardDebugOutput=0
; Count every DirectDraw/Direct3D call per calling function and write BWDecomp.directx.csv when the game
; ends (summarise with tools/directx_report.py). Slows rendering slightly.
TraceDirectX=0
; Key that saves a screenshot to Screenshots\ in the game folder (Print Screen cannot capture full-screen
; DirectDraw). Windows virtual-key code in decimal: 123 = F12, 122 = F11. 0 = no key.
ScreenshotKey=0

[Log]
; 1 = also log every installed hook in BWDecomp.log.
Debug=0
